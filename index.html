<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Overshare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="phoneWrap">
  <div id="phone">
    <div id="statusbar"><span>9:41</span><span>●&nbsp;●&nbsp;●&nbsp;<span style="margin-left:4px;">100%</span></span></div>

    <div id="home-view" class="view active">
      <div id="feedViewport">
        <div id="feedBg">
          <span class="fshape" style="top:14%; left:8%; animation-delay:.2s;">✦</span>
          <span class="fshape" style="top:30%; right:10%; animation-delay:1.1s;">◡</span>
          <span class="fshape" style="top:58%; left:14%; animation-delay:.6s;">✧</span>
          <span class="fshape" style="top:72%; right:16%; animation-delay:1.6s;">⌒</span>
          <span class="fshape" style="top:44%; left:48%; animation-delay:.9s;">·˚</span>
        </div>
        <div id="feedList"></div>
      </div>
    </div>

    <div id="messages-view" class="view">
      <div class="screen" id="convListScreen">
        <div class="msgHeader"><h1>Messages</h1></div>
        <div class="convList" id="convList"></div>
      </div>
      <div class="screen" id="threadScreen" style="display:none;">
        <div class="threadHeader">
          <button class="iconBtn" style="background:rgba(30,18,32,.06); color:var(--ink);" onclick="closeThread()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="avatar" id="threadAvatar" style="width:38px;height:38px;font-size:18px;"></div>
          <div class="name" id="threadName"></div>
          <button class="iconBtn" style="background:rgba(30,18,32,.06); color:var(--ink);" onclick="showToast('Calling...')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button class="iconBtn" style="background:rgba(30,18,32,.06); color:var(--ink);" onclick="showToast('Starting video call...')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </button>
        </div>
        <div class="threadBody" id="threadBody"></div>
        <div class="composerRow">
          <input id="composerInput" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendTextMsg()">
          <button onclick="sendTextMsg()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="profile-view" class="view">
      <div class="screen" id="profileScreen"></div>
      <button class="fab bigBtn" style="background:linear-gradient(100deg, var(--pal-pw1), var(--pal-pw2)); color:#2E2440;" onclick="openCreateChooser()">+ Create</button>
    </div>

    <nav id="bottomnav">
      <button class="navBtn active" data-view="home" onclick="switchView('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Home
      </button>
      <button class="navBtn" data-view="messages" onclick="switchView('messages')" style="position:relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.35A8.5 8.5 0 1 1 21 11.5z"/></svg>
        Messages
        <span id="navPing" style="display:none; position:absolute; top:-2px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--burgundy);"></span>
      </button>
      <button class="navBtn" data-view="profile" onclick="switchView('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
        Profile
      </button>
    </nav>

    <div id="overlayRoot"></div>
    <div id="toast"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
